{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-warning text-center">Login</h2>
            <form method="post" class="card p-4 shadow">
                {% csrf_token %}
                {{form.as_p}}
                <button type="submit" class="btn btn-warning">Login</button>
                <p>Don't have an account registered here? <a href="{% url 'register' %}" class="text-warning">Register</a></p>
            </form>
           
        </div>
    </div>
</div>

{% endblock %}
